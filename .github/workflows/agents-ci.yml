name: agents-ci

# 日常门禁由本地三档检查承担（scripts/local-ci.ps1 + .githooks/pre-push，hooksPath 由 scripts/setup-hooks.ps1 自动设置）。
# push/PR 触发轻量档（agents 档，与三档唯一真源共用同一组 check-*.js 脚本）作为本地门禁被绕过时的远程兜底；
# workflow_dispatch 保留为发布前手动全量验收。
on:
  push:
    paths:
      - 'agents/**'
      - '.better-harness/**'
      - 'capabilities/**'
      - 'scripts/**'
      - '.githooks/**'
      - '.github/workflows/agents-ci.yml'
  pull_request:
    paths:
      - 'agents/**'
      - '.better-harness/**'
      - 'capabilities/**'
      - 'scripts/**'
      - '.githooks/**'
      - '.github/workflows/agents-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tianhuo agent contract
        run: node agents/tianhuo/scripts/check-runtime-contract.js
      - name: Install gates dependencies (js-yaml only)
        working-directory: agents/tianhuo/gates
        run: npm ci
      - name: Validate structured assets under agents
        run: node agents/tianhuo/scripts/check-structured-assets.js
      - name: Validate derived markdown assets
        run: node agents/tianhuo/scripts/check-markdown-assets.js
      - name: Validate harness core-code boundary
        run: node agents/tianhuo/scripts/check-core-code.js
