name: runtime-ci

# 日常门禁由本地三档检查承担（scripts/local-ci.ps1 + .githooks/pre-push，hooksPath 由 scripts/setup-hooks.ps1 自动设置）。
# push/PR 触发 light-check 轻量档（typecheck，复用 runtime/package.json 的 typecheck 脚本，即三档中 contract 档的核心）
# 作为本地门禁被绕过时的远程兜底；workflow_dispatch 保留为发布前手动全量验收。
on:
  push:
    paths:
      - 'runtime/**'
      - 'integrations/open-code-review/**'
      - '.github/workflows/runtime-ci.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'integrations/open-code-review/**'
      - '.github/workflows/runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light-check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - name: 'Light gate: TypeScript typecheck (contract 档核心)'
        run: npm run typecheck

  ocr-producer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/open-code-review/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/open-code-review/src/go.mod
          cache: false
      - name: Test minimal OCR producer
        run: go test ./...
      - name: Build engine-local OCR producer
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          mkdir -p ../bin
          go build -trimpath -o "../bin/ocr${suffix}" ./cmd/ocr
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Export native OCR binary path
        run: node -e "const fs=require('node:fs'),p=require('node:path');fs.appendFileSync(process.env.GITHUB_ENV,'AWKN_TEST_OCR_BINARY='+p.resolve('../bin',process.platform==='win32'?'ocr.exe':'ocr')+String.fromCharCode(10))"
      - name: Install Runtime dependencies
        working-directory: runtime
        run: npm ci
      - name: Verify OCR and Native Git content binding
        working-directory: runtime
        run: node --import tsx --test test/ocr-producer-integration.test.ts

  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - name: Run runtime checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "check-${{ matrix.os }}-node-${{ matrix.node }}.log"
      - name: Verify TypeScript build
        shell: bash
        run: npm run build 2>&1 | tee "build-${{ matrix.os }}-node-${{ matrix.node }}.log"
      - name: Generate deterministic dependency manifest
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/dependency-evidence.mjs
      - name: Generate CycloneDX SBOM
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        shell: bash
        run: npm sbom --sbom-format cyclonedx > baseline/sbom.cdx.json
      - name: Capture npm audit evidence
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        shell: bash
        run: npm audit --omit=dev --json > baseline/npm-audit.json || true
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            runtime/check-${{ matrix.os }}-node-${{ matrix.node }}.log
            runtime/build-${{ matrix.os }}-node-${{ matrix.node }}.log
            runtime/architecture-scan.json
            runtime/baseline/agent-os-3.0-baseline.json
            runtime/baseline/dependency-manifest.json
            runtime/baseline/sbom.cdx.json
            runtime/baseline/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
