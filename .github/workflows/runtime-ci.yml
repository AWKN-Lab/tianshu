name: runtime-ci

on:
  pull_request:
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime-ci.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime-ci.yml'

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - name: Run runtime checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "check-${{ matrix.os }}-node-${{ matrix.node }}.log"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            runtime/check-${{ matrix.os }}-node-${{ matrix.node }}.log
            runtime/architecture-scan.json
          if-no-files-found: warn
          retention-days: 14
