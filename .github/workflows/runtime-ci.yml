name: runtime-ci

on:
  pull_request:
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime-ci.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime-ci.yml'

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - name: Run runtime checks
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Upload check log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-check-log
          path: runtime/check.log
          if-no-files-found: error
          retention-days: 7
